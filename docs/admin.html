<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>管理画面 | SPI言語対策道場</title>
    <link rel="stylesheet" href="style.css?v=20261103-3">
    <link rel="stylesheet" href="publish-queue.css?v=20261103-3">
    <link rel="stylesheet" href="admin.css?v=20261103-3">
  </head>
  <body>
    <header><a href="./">SPI言語対策道場</a></header>
    <main>
      <section id="login-panel" class="card">
        <h1>管理者ログイン</h1>
        <form id="login-form">
          <label for="admin-email">メールアドレス</label>
          <input id="admin-email" type="email" required autocomplete="email">
          <button id="login-button" class="primary" type="submit">ログイン用リンクを送る</button>
        </form>
        <p id="login-status" role="status"></p>
      </section>

      <div id="admin-panel" hidden>
        <div class="admin-heading">
          <h1>問題管理</h1>
          <button id="logout" type="button">ログアウト</button>
        </div>
        <section class="card" aria-labelledby="submissions-title">
          <div class="section-heading">
            <h2 id="submissions-title">届いた語句 <span id="submission-count">0件</span></h2>
            <button id="reload-submissions" type="button">再読み込み</button>
          </div>
          <p id="submission-list-status" role="status"></p>
          <ol id="submission-list" class="submission-list"></ol>
        </section>

        <section class="card question-builder" aria-labelledby="builder-title">
          <h2 id="builder-title">問題を作る</h2>
          <form id="word-form">
            <label for="word-input">出題する語句</label>
            <input type="text" id="word-input" maxlength="40" required placeholder="例：垂涎" autocomplete="off">
            <button type="submit" id="lookup-submit" class="primary">意味を調べる</button>
          </form>
          <div id="word-preview" class="preview-card" hidden>
            <label id="definition-field" for="definition-select">問題に使う意味</label>
            <select id="definition-select"></select>
            <label for="reading-input">ふりがな</label>
            <input id="reading-input" type="text" maxlength="200" autocomplete="off" placeholder="例：おうぶんな">
            <h3 id="preview-question"></h3>
            <ol id="preview-choices" type="A"></ol>
            <p id="preview-answer"></p>
            <p class="source-note">意味の出典：<a id="preview-source" target="_blank" rel="noopener noreferrer">日本語Wiktionary</a>（CC BY-SA 4.0）</p>
            <button id="queue-word-question" type="button" class="primary">公開待ちリストに保存</button>
            <button id="regenerate-word-question" type="button">誤答を入れ替える</button>
          </div>
          <p id="word-status" role="status"></p>
          <div class="publish-queue" aria-labelledby="publish-queue-title">
            <h3 id="publish-queue-title">公開待ちリスト <span id="publish-count">0問</span></h3>
            <p id="publish-empty">まだ問題は保存されていません。</p>
            <ol id="publish-list"></ol>
            <button id="publish-all-questions" type="button" class="primary" disabled>GitHubへまとめて登録</button>
            <button id="publish-complete" type="button" class="primary" hidden>公開完了（届いたリストから消す）</button>
            <button id="clear-publish-list" type="button" disabled>リストを空にする</button>
            <p class="source-note">GitHubでSubmitして公開を確認した後、「公開完了」を1回押すと、公開した語句が届いたリストからまとめて消えます。</p>
          </div>
        </section>
      </div>
    </main>
    <script type="module" src="admin.js?v=20261103-5"></script>
  </body>
</html>
