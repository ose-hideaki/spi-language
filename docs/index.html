<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SPI言語対策道場</title>
    <link rel="stylesheet" href="style.css?v=20261103-3">
  </head>
  <body>
    <header>
      <a href="./">SPI言語対策道場</a>
    </header>
    <main>
      <section id="home">
        <div class="start-card">
          <h1>語句の意味</h1>
          <label class="count-control"><span>問題数</span>
            <select id="count"><option value="5">5問</option><option value="10">10問</option><option value="99">全問</option></select>
          </label>
          <div class="home-actions">
            <button id="start" class="primary">始める</button>
            <button id="review">復習する</button>
          </div>
          <p id="notice" role="status"></p>
        </div>
        <div class="stats">
          <div><span>収録</span><strong id="total">0</strong></div>
          <div><span>解答</span><strong id="done">0</strong></div>
          <div><span>正答率</span><strong id="rate">—</strong></div>
        </div>
        <section class="card submission-card" aria-labelledby="submission-title">
          <h2 id="submission-title">追加してほしい語句</h2>
          <form id="submission-form">
            <label for="submission-word">語句</label>
            <div class="submission-row">
              <input type="text" id="submission-word" maxlength="40" required placeholder="例：垂涎" autocomplete="off">
              <button type="submit" id="submission-submit" class="primary">送信</button>
            </div>
            <input class="honeypot" type="text" id="submission-website" tabindex="-1" autocomplete="off" aria-hidden="true">
          </form>
          <p id="submission-status" role="status"></p>
        </section>
      </section>

      <section id="practice" hidden>
        <div class="practice-header">
          <button id="exit" class="back-button">← ホーム</button>
          <div class="session-status">
            <div class="question-number"><span id="position"></span><small>設問</small></div>
            <div class="elapsed-time"><small>経過時間</small><span id="timer">0:00</span></div>
          </div>
        </div>
        <article class="practice-card">
          <p class="eyebrow" id="kind"></p>
          <h2 id="question"></h2>
          <p id="passage" class="passage" hidden></p>
          <fieldset id="choices"><legend class="sr">回答を一つ選択</legend></fieldset>
          <div id="feedback" role="status" hidden></div>
        </article>
        <div class="practice-progress">
          <span>進み具合</span>
          <progress id="progress" max="1" value="0"></progress>
        </div>
        <div class="practice-actions">
          <button id="submit" class="primary" disabled>回答する →</button>
          <button id="next" class="primary" hidden>次の問題 →</button>
        </div>
      </section>

      <section id="result" class="card" hidden>
        <p class="eyebrow">PRACTICE COMPLETE</p>
        <h2>おつかれさまでした。</h2>
        <p id="score" class="score"></p>
        <p id="duration"></p>
        <button id="again" class="primary">ホームに戻る</button>
      </section>

      <footer>
        <p>非公式教材 ・ <a href="about.html">出典と利用情報</a></p>
        <p id="storage-status" role="status"></p>
      </footer>
    </main>
    <script src="questions.js?v=20261103-3"></script>
    <script src="app.js?v=20261103-3"></script>
    <script type="module" src="submission.js?v=20261103-4"></script>
  </body>
</html>
